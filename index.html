:root{
  --felt:#16332b; --felt-deep:#0f251f; --panel:#1b3d34; --line:#2f5b4d;
  --ivory:#f3edda; --muted:#a9bfb2;
  --brass:#e6ae3c; --sea:#58b6d6; --mint:#7fd6a6; --coral:#ef6b5b;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--felt);color:var(--ivory);
  font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
}
:focus-visible{outline:2px solid var(--ivory);outline-offset:2px}

header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px 10px}
h1{margin:0;font:600 24px/1.1 "Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;letter-spacing:.2px}
#songName{margin:3px 0 0;color:var(--muted);font-size:14px}
.head-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{
  font:inherit;color:var(--ivory);background:transparent;border:1px solid var(--line);
  border-radius:8px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;
}
.btn:hover{background:rgba(255,255,255,.07)}
.btn.primary{background:var(--brass);border-color:var(--brass);color:#2a1d02;font-weight:600;min-width:108px;justify-content:center}
.btn.primary:hover{background:#f1bb55}
.btn.small{padding:6px 10px;font-size:14px}
.btn svg{width:14px;height:14px;fill:currentColor}

.pill{
  font:inherit;color:var(--ivory);background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:7px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:9px;
}
.pill .dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.pill.ok .dot{background:var(--mint);box-shadow:0 0 0 3px rgba(127,214,166,.25)}

.stage-wrap{
  position:relative;flex:1 1 auto;min-height:380px;margin:0 12px;border-radius:10px;overflow:hidden;
  background:var(--felt-deep);display:flex;flex-direction:column;
}
.pane{position:relative;min-height:0}
#scoreWrap{background:#f3edda;border-bottom:3px solid var(--felt)}
.pane canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#stage{touch-action:none}
.v-both #scoreWrap{flex:0 0 42%}
.v-both #fallWrap{flex:1 1 0}
.v-score #scoreWrap{flex:1 1 0}
.v-score #fallWrap{flex:0 0 auto}
.v-falling #scoreWrap{display:none}
.v-falling #fallWrap{flex:1 1 0}
.waithint{
  position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:2;display:none;
  background:var(--felt);color:var(--ivory);border:1px solid var(--brass);border-radius:999px;padding:6px 16px;font-weight:600;
}
.waithint.on{display:block}
.drop{
  position:absolute;inset:0;z-index:3;display:none;align-items:center;justify-content:center;
  background:rgba(15,37,31,.88);color:var(--ivory);font-size:20px;border:2px dashed var(--brass);border-radius:10px;
}
.drop.on{display:flex}

.controls{background:var(--panel);border-top:1px solid var(--line);margin-top:12px;padding:12px 16px 16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.row.transport{flex-wrap:nowrap}
.seek{position:relative;flex:1 1 200px;min-width:120px;display:flex;align-items:center}
.seek input{width:100%}
.loopbar{position:absolute;left:0;width:0;bottom:-2px;height:5px;border-radius:3px;background:var(--brass);opacity:.8;pointer-events:none}
.time{font-variant-numeric:tabular-nums;color:var(--muted);min-width:92px;text-align:right}
input[type=range]{accent-color:var(--brass)}
label{display:inline-flex;align-items:center;gap:8px;color:var(--muted)}
select{
  font:inherit;background:var(--felt);color:var(--ivory);border:1px solid var(--line);
  border-radius:6px;padding:6px 8px;
}
select:disabled{opacity:.45}
output{min-width:42px;color:var(--ivory);font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;color:var(--ivory);background:transparent;border:0;padding:7px 12px;cursor:pointer}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--ivory);color:#16332b;font-weight:600}
.legend{display:inline-flex;gap:14px;color:var(--muted)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}
.checkbox input{accent-color:var(--brass)}
#loopText{color:var(--muted);min-width:140px}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ivory);color:#16332b;
  padding:9px 16px;border-radius:8px;max-width:90vw;opacity:0;transition:opacity .2s;pointer-events:none;z-index:5
}
.toast.show{opacity:1}

@media (max-width:640px){
  header{padding:12px 14px 8px}
  .row.transport{flex-wrap:wrap}
  .time{text-align:left}
}
</style>
<meta name="theme-color" content="#16332b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>

<header>
  <div>
    <h1>Piano practice</h1>
    <p id="songName">Ode to Joy</p>
  </div>
  <div class="head-actions">
    <button class="btn" id="openBtn">Open MIDI file</button>
    <input type="file" id="file" accept=".mid,.midi,audio/midi,audio/x-midi" hidden>
    <button class="btn" id="demoBtn">Load Ode to Joy</button>
    <button class="pill" id="midiPill" title="Connect a piano or keyboard over USB"><span class="dot"></span><span id="midiText">Connect my piano</span></button>
  </div>
</header>

<main class="stage-wrap v-both" id="wrap">
  <div class="pane" id="scoreWrap"><canvas id="score" aria-label="Sheet music"></canvas></div>
  <div class="pane" id="fallWrap"><canvas id="stage" aria-label="Piano keyboard with falling notes"></canvas></div>
  <div class="waithint" id="waitHint">Play the lit keys to continue</div>
  <div class="drop" id="drop">Drop a MIDI file to load it</div>
</main>

<section class="controls">
  <div class="row transport">
    <button class="btn primary" id="play"></button>
    <button class="btn" id="restart">Restart</button>
    <div class="seek">
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Position in the song">
      <div class="loopbar" id="loopbar"></div>
    </div>
    <span class="time" id="time">0:00 / 0:00</span>
  </div>

  <div class="row">
    <label>Speed <input type="range" id="speed" min="25" max="150" step="5" value="100"><output id="speedOut">100%</output></label>
    <div class="seg" role="group" aria-label="Practice mode">
      <button id="mListen" aria-pressed="true" title="The song plays by itself while you watch">Listen</button>
      <button id="mWait" aria-pressed="false" title="The song pauses on each note until you play it">Wait for me</button>
    </div>
    <label>I play
      <select id="practice" disabled>
        <option value="both">Both hands</option>
        <option value="right">Right hand</option>
        <option value="left">Left hand</option>
      </select>
    </label>
    <span class="legend"><span><i class="sw" style="background:var(--brass)"></i>Right hand</span><span><i class="sw" style="background:var(--sea)"></i>Left hand</span></span>
  </div>

  <div class="row">
    <label>View
      <select id="view">
        <option value="both">Sheet music and falling notes</option>
        <option value="score">Sheet music and keyboard</option>
        <option value="falling">Falling notes only</option>
      </select>
    </label>
    <label>Sound
      <select id="output">
        <option value="computer">Computer speakers</option>
        <option value="piano">My piano (USB)</option>
        <option value="off">Off</option>
      </select>
    </label>
    <label>Note names
      <select id="names">
        <option value="en">C D E</option>
        <option value="sol">Dó Ré Mi</option>
        <option value="off">Off</option>
      </select>
    </label>
    <label>Hands
      <select id="handsBy">
        <option value="track">Split by track</option>
        <option value="split">Split at middle C</option>
      </select>
    </label>
    <label class="checkbox"><input type="checkbox" id="echo"> Also play my keys through the computer</label>
  </div>

  <div class="row">
    <button class="btn small" id="loopA">Loop starts here</button>
    <button class="btn small" id="loopB">Loop ends here</button>
    <button class="btn small" id="loopClear">Clear loop</button>
    <span id="loopText">No loop set</span>
  </div>
</section>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
'use strict';

/* ---------- constants ---------- */
const LOW = 21, HIGH = 108;          // A0 to C8, the 88 keys of a full piano
const LEAD = 1.5;                    // seconds of lead-in before the first note
const LOOKAHEAD = 3.2;               // seconds of music visible above the keys
const COL = {
  lane:'#0f251f', laneLine:'rgba(243,237,218,.05)', octave:'rgba(243,237,218,.13)',
  white:'#f3edda', whiteEdge:'#cfc7ae', black:'#232b27',
  mint:'#7fd6a6', coral:'#ef6b5b',
  R:{ n:'#e6ae3c', b:'#c38b1f', hi:'#ffd47d' },
  L:{ n:'#58b6d6', b:'#3a92b3', hi:'#a8e2f5' }
};
const NAMES = {
  en:['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'],
  sol:['Dó','Dó♯','Ré','Ré♯','Mi','Fá','Fá♯','Sol','Sol♯','Lá','Lá♯','Si']
};
const LETTER_EN = ['C','D','E','F','G','A','B'];
const LETTER_SOL = ['Dó','Ré','Mi','Fá','Sol','Lá','Si'];
const BLACKSET = new Set([1,3,6,8,10]);
const isBlack = m => BLACKSET.has(m % 12);

const whiteIdx = {}, WHITE_LIST = [], BLACK_LIST = [];
(() => { let c = 0; for (let m = LOW; m <= HIGH; m++) { whiteIdx[m] = c; if (isBlack(m)) BLACK_LIST.push(m); else { WHITE_LIST.push(m); c++; } } })();
const WHITES = WHITE_LIST.length;

const $ = s => document.querySelector(s);
const cv = $('#stage'), ctx = cv.getContext('2d');
const sc = $('#score'), sctx = sc.getContext('2d');

/* ---------- state ---------- */
const S = {
  notes:[], dur:0, maxDur:0, name:'',
  ks:0, ts:{ num:4, den:4 }, bars:[], sgroups:[],
  pos:-LEAD, playing:false, speed:1,
  mode:'listen', practice:'both', output:'computer', names:'en', handsBy:'track', echo:false, view:'both',
  next:0, groups:[], gi:0, waiting:false, loopA:null, loopB:null
};
const pressed = new Map();   // midi -> {src, t}   keys currently down (from piano or screen)
const recent = new Map();    // midi -> time of last press, used by "Wait for me"
const live = new Map();      // sounding voices for the player's own keys
const songVoices = new Set();
const timers = new Set();
const midiOn = new Set();

/* ---------- audio (simple piano-like synth) ---------- */
let actx = null, master = null;
function ensureAudio() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    actx = new AC();
    master = actx.createGain(); master.gain.value = 0.6;
    const comp = actx.createDynamicsCompressor();
    master.connect(comp); comp.connect(actx.destination);
  }
  if (actx.state === 'suspended') actx.resume();
  return true;
}
function startVoice(midi, vel, when, owner) {
  const f = 440 * Math.pow(2, (midi - 69) / 12);
  const g = actx.createGain();
  const peak = 0.08 + 0.2 * Math.max(0, Math.min(1, vel));
  const decay = Math.max(0.6, 3.2 - (midi - 21) / 88 * 2.6);
  g.gain.setValueAtTime(0.0001, when);
  g.gain.linearRampToValueAtTime(peak, when + 0.006);
  g.gain.setTargetAtTime(peak * 0.25, when + 0.006, decay / 3);
  const oscs = [['triangle',1,1],['sine',2,0.4],['sine',3,0.15],['sine',4,0.06]].map(([type, mult, amp]) => {
    const o = actx.createOscillator(); o.type = type; o.frequency.value = f * mult;
    const og = actx.createGain(); og.gain.value = amp;
    o.connect(og); og.connect(g); o.start(when); return o;
  });
  g.connect(master);
  const v = {
    stop(at) {
      const t = Math.max(at, actx.currentTime);
      try {
        g.gain.cancelScheduledValues(t);
        g.gain.setTargetAtTime(0.0001, t, 0.08);
        oscs.forEach(o => o.stop(t + 0.6));
      } catch (e) { /* already stopped */ }
    }
  };
  if (owner) { owner.add(v); oscs[0].onended = () => owner.delete(v); }
  return v;
}

/* ---------- MIDI file parser ---------- */
// <parse>
function parseMidi(buf) {
  const d = new DataView(buf);
  let p = 0;
  const str = n => { let s = ''; for (let i = 0; i < n; i++) s += String.fromCharCode(d.getUint8(p + i)); p += n; return s; };
  const varlen = () => { let v = 0, b; do { b = d.getUint8(p++); v = (v << 7) | (b & 0x7f); } while (b & 0x80); return v; };

    ctx.fill();
    ctx.strokeStyle = COL.whiteEdge; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(Math.round(k.x + k.w) + 0.5, hitY + 3); ctx.lineTo(Math.round(k.x + k.w) + 0.5, hitY + keyH); ctx.stroke();
    const isC = m % 12 === 0;
    if (S.names !== 'off' && (isC || wk >= 17)) {
      const lab = nameOf(m) + (isC ? (Math.floor(m / 12) - 1) : '');
      ctx.fillStyle = '#4f5f55'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.font = Math.max(8, Math.min(11, wk * 0.42)) + 'px system-ui,sans-serif';
      ctx.fillText(lab, k.x + k.w / 2, hitY + keyH - 8);
    }
    if (m === 60) {                                   // middle C marker
      ctx.fillStyle = '#e6ae3c'; ctx.beginPath(); ctx.arc(k.x + k.w / 2, hitY + keyH - 24, Math.max(2.5, wk * 0.12), 0, 6.283); ctx.fill();
    }
  }
  for (const m of BLACK_LIST) {
    const k = keyX(m);
    ctx.fillStyle = colorFor(m, true);
    rr(ctx, k.x, hitY + 3, k.w, keyH * 0.62, [0, 0, 3, 3]);
    ctx.fill();
  }
}

/* ---------- drawing: sheet music ---------- */
const INK = '#1f2a25', PAST = '#a9b0a8', PAPER = '#f3edda', STAFFC = '#3b4740', MUTED = '#7b877f';
const HAND_DARK = { R:'#b57a0c', L:'#1f7fa3' };
const MUSIC_FONT = 'NotoMusicSub, "Segoe UI Symbol", "Apple Symbols", serif';

function drawScore() {
  if (S.view === 'falling') return;
  const c = sctx;
  c.clearRect(0, 0, SW, SH);
  c.fillStyle = PAPER; c.fillRect(0, 0, SW, SH);

  const g = Math.max(6, Math.min(15, SH / 20.5));          // space between staff lines
  const tTop = (SH - 14 * g) / 2, tBot = tTop + 4 * g, bTop = tBot + 6 * g, bBot = bTop + 4 * g;
  const yT = s => tBot - (s - 30) * g / 2;
  const yB = s => bBot - (s - 18) * g / 2;
  const hw = g * 1.3;                                       // notehead width
  const sf = S.ks;
  const clefW = g * 3.6, ksW = Math.abs(sf) * g * 0.95 + (sf ? g * 0.5 : 0), tsW = g * 2.6;
  const headerW = 12 + clefW + ksW + tsW;
  const playX = Math.min(headerW + g * 5, SW * 0.45);
  const pps = Math.max(80, Math.min(240, SW * 0.11));
  const pos = S.pos;
  const lw = Math.max(1, g * 0.09);

  const staffLines = (x0, x1) => {
    c.strokeStyle = STAFFC; c.lineWidth = lw;
    for (let i = 0; i < 5; i++) {
      for (const top of [tTop, bTop]) { const y = Math.round(top + i * g) + 0.5; c.beginPath(); c.moveTo(x0, y); c.lineTo(x1, y); c.stroke(); }
    }
  };
  staffLines(6, SW);

  // everything that scrolls is clipped to the right of the clef area
  c.save();
  c.beginPath(); c.rect(headerW, 0, SW - headerW, SH); c.clip();

  const pad = hw * 1.1;                                     // space between a bar line and the first note after it
  const tMin = pos - (playX + pad - headerW + hw * 2) / pps, tMax = pos + (SW - playX + hw * 2) / pps;

  // bar lines and bar numbers
  const bars = S.bars;
  c.font = '600 ' + Math.max(9, g * 0.9) + 'px system-ui,sans-serif';
  c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  for (let b = lowerBoundBy(bars, tMin, v => v); b < bars.length && bars[b] <= tMax; b++) {
    const x = Math.round(playX + (bars[b] - pos) * pps) + 0.5;
    c.strokeStyle = STAFFC; c.lineWidth = lw;
    c.beginPath(); c.moveTo(x, tTop); c.lineTo(x, bBot); c.stroke();
    c.fillStyle = MUTED; c.fillText(String(b + 1), x + 4, tTop - g * 0.6);
  }

  // notes
  const gs = S.sgroups;
  const fam = '"NotoMusicSub", "Segoe UI Symbol", "Apple Symbols", serif';
  for (let i = lowerBoundBy(gs, tMin, v => v.t); i < gs.length && gs[i].t <= tMax; i++) {
    const grp = gs[i];
    const x = playX + (grp.t - pos) * pps + pad;
    const yOf = grp.staff === 'T' ? yT : yB;
    const lo = grp.staff === 'T' ? 30 : 18, hi = lo + 8, mid = lo + 4;
    let stemColor = INK;
    for (const n of grp.notes) {
      const sounding = n.start <= pos + 1e-6 && pos < n.end;
      const done = n.end <= pos;
      const color = sounding ? HAND_DARK[n.hand] : (done ? PAST : INK);
      if (sounding) stemColor = color; else if (stemColor === INK && done) stemColor = PAST;
      const cx = x + (n.off ? hw : 0), cy = yOf(n.step);

      // ledger lines
      c.strokeStyle = color; c.lineWidth = Math.max(1, lw * 1.2);
      if (n.step < lo) for (let s = lo - 2; s >= n.step; s -= 2) { const y = Math.round(yOf(s)) + 0.5; c.beginPath(); c.moveTo(cx - hw * 0.85, y); c.lineTo(cx + hw * 0.85, y); c.stroke(); }
      if (n.step > hi) for (let s = hi + 2; s <= n.step; s += 2) { const y = Math.round(yOf(s)) + 0.5; c.beginPath(); c.moveTo(cx - hw * 0.85, y); c.lineTo(cx + hw * 0.85, y); c.stroke(); }

      // accidental
      if (n.accShow !== null) {
        c.fillStyle = color; c.font = (3 * g) + 'px ' + fam; c.textAlign = 'right'; c.textBaseline = 'alphabetic';
        c.fillText(n.accShow === 1 ? '\u266F' : n.accShow === -1 ? '\u266D' : '\u266E', cx - hw * 0.62, cy);
      }

      // notehead
      c.beginPath();
      c.ellipse(cx, cy, hw * (n.dv >= 4 ? 0.56 : 0.5), g * 0.46, n.dv >= 4 ? 0 : -0.35, 0, 6.2832);
      if (n.dv >= 2) { c.fillStyle = PAPER; c.fill(); c.strokeStyle = color; c.lineWidth = Math.max(1.4, g * 0.2); c.stroke(); }
      else { c.fillStyle = color; c.fill(); }

      // dot
      if (n.dot) { c.fillStyle = color; c.beginPath(); c.arc(cx + hw * 0.85, n.step % 2 === 0 ? yOf(n.step + 1) : cy, g * 0.16, 0, 6.2832); c.fill(); }

      // note name
      if (S.names !== 'off' && g >= 8) {
        const txt = (S.names === 'sol' ? LETTER_SOL : LETTER_EN)[n.letter];
        c.font = '700 ' + Math.max(8, g * 0.95) + 'px system-ui,sans-serif';
        c.textAlign = 'center'; c.textBaseline = 'middle';
        const ly = grp.up || !grp.stem ? cy + g * 1.05 : cy - g * 1.05;
        c.lineWidth = 3; c.strokeStyle = PAPER; c.strokeText(txt, cx, ly);
        c.fillStyle = sounding ? color : MUTED; c.fillText(txt, cx, ly);
      }
    }

    // stem and flags (one per chord)
    if (grp.stem) {
      const up = grp.up;
      const sx = Math.round(x + (up ? hw * 0.47 : -hw * 0.47)) + 0.5;
      let y0, y1;
      if (up) { y0 = yOf(grp.lo); y1 = yOf(Math.max(grp.hi + 7, mid)); }
      else { y0 = yOf(grp.hi); y1 = yOf(Math.min(grp.lo - 7, mid)); }
      c.strokeStyle = stemColor; c.lineWidth = Math.max(1.2, g * 0.13);
      c.beginPath(); c.moveTo(sx, y0); c.lineTo(sx, y1); c.stroke();
      c.lineWidth = Math.max(1.5, g * 0.28); c.lineCap = 'round';
      for (let f = 0; f < grp.fl; f++) {
        const fy = up ? y1 + f * g * 0.95 : y1 - f * g * 0.95, d = up ? 1 : -1;
        c.beginPath(); c.moveTo(sx, fy); c.quadraticCurveTo(sx + g * 1.1, fy + d * g * 1.2, sx + g * 0.7, fy + d * g * 2.3); c.stroke();
      }
      c.lineCap = 'butt';
    }
  }
  c.restore();

  // clef area (covers notes that have scrolled past)
  c.fillStyle = PAPER; c.fillRect(0, 0, headerW, SH);
  staffLines(6, headerW);
  c.strokeStyle = STAFFC; c.lineWidth = Math.max(2, g * 0.22);
  c.beginPath(); c.moveTo(7, tTop); c.lineTo(7, bBot); c.stroke();
  c.fillStyle = INK; c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  c.font = (4.16 * g) + 'px ' + fam;
  c.fillText('\uD834\uDD1E', 12, yT(32));
  c.fillText('\uD834\uDD22', 12, bTop + 3.6 * g);

  // key signature
  c.font = (3 * g) + 'px ' + fam;
  for (let i = 0; i < Math.abs(sf); i++) {
    const st = sf > 0 ? SHARP_STEPS_T[i] : FLAT_STEPS_T[i];
    const x = 12 + clefW + i * g * 0.95, glyph = sf > 0 ? '\u266F' : '\u266D';
    c.fillText(glyph, x, yT(st));
    c.fillText(glyph, x, yB(st - 14));
  }

  // time signature
  c.font = '700 ' + (g * 2.1) + 'px Georgia,"Times New Roman",serif';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  const tx = 12 + clefW + ksW + tsW / 2;
  for (const top of [tTop, bTop]) {
    c.fillText(String(S.ts.num), tx, top + g);
    c.fillText(String(S.ts.den), tx, top + 3 * g);
  }

  // playhead
  c.fillStyle = 'rgba(230,174,60,.85)';
  c.fillRect(Math.round(playX + pad - hw * 0.85) - 1, tTop - g * 1.2, 2.5, bBot - tTop + g * 2.4);
}

/* ---------- on-screen keyboard: mouse and touch ---------- */
function keyAt(x, y) {
  if (y < hitY + 3) return null;
  if (y - hitY < keyH * 0.62) {
    for (const m of BLACK_LIST) { const k = keyX(m); if (x >= k.x && x <= k.x + k.w) return m; }
  }
  const wi = Math.floor(x / wk);
  return WHITE_LIST[wi] ?? null;
}
const ptr = new Map();
const local = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
cv.addEventListener('pointerdown', e => {
  const [x, y] = local(e), m = keyAt(x, y);
  if (m == null) return;
  cv.setPointerCapture(e.pointerId);
  ptr.set(e.pointerId, m); keyDown(m, 0.8, 'screen');
});
cv.addEventListener('pointermove', e => {
  if (!ptr.has(e.pointerId)) return;
  const [x, y] = local(e), m = keyAt(x, y), old = ptr.get(e.pointerId);
  if (m != null && m !== old) { keyUp(old); ptr.set(e.pointerId, m); keyDown(m, 0.8, 'screen'); }
});
const endPtr = e => { if (ptr.has(e.pointerId)) { keyUp(ptr.get(e.pointerId)); ptr.delete(e.pointerId); } };
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);

/* ---------- controls ---------- */
const fmt = t => { t = Math.max(0, t); return Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0'); };
const ICON_PLAY = '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 1l11 6-11 6z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 1h3.5v12H2zM8.5 1H12v12H8.5z"/></svg>';
const playBtn = $('#play'), seekEl = $('#seek'), timeEl = $('#time'), waitHint = $('#waitHint');
let dragging = false, lastPlaying = null;

function updateUI() {
  const p = Math.max(0, Math.min(S.dur, S.pos));
  if (!dragging && S.dur > 0) seekEl.value = Math.round(p / S.dur * 1000);
  timeEl.textContent = fmt(p) + ' / ' + fmt(S.dur);
  waitHint.classList.toggle('on', S.waiting);
  if (lastPlaying !== S.playing) {
    lastPlaying = S.playing;
    playBtn.innerHTML = (S.playing ? ICON_PAUSE + 'Pause' : ICON_PLAY + 'Play');
  }
}
function updateLoop() {
  const bar = $('#loopbar'), txt = $('#loopText');
  if (S.loopA !== null && S.loopB !== null && S.dur > 0) {
    bar.style.left = (S.loopA / S.dur * 100) + '%';
    bar.style.width = ((S.loopB - S.loopA) / S.dur * 100) + '%';
    txt.textContent = 'Loop ' + fmt(S.loopA) + ' to ' + fmt(S.loopB);
  } else {
    bar.style.width = '0';
    txt.textContent = S.loopA !== null ? 'Loop starts at ' + fmt(S.loopA) + '. Now set the end.' : 'No loop set';
  }
}
let toastTimer = null;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
}
function setMode(m) {
  S.mode = m;
  $('#mListen').setAttribute('aria-pressed', m === 'listen');
  $('#mWait').setAttribute('aria-pressed', m === 'wait');
  $('#practice').disabled = m !== 'wait';
  silenceAll(); rebuildGroups();
}

playBtn.addEventListener('click', togglePlay);
$('#restart').addEventListener('click', () => { seek(-LEAD); });
seekEl.addEventListener('pointerdown', () => { dragging = true; });
window.addEventListener('pointerup', () => { dragging = false; });
seekEl.addEventListener('input', () => { seek(seekEl.value / 1000 * S.dur); });
$('#speed').addEventListener('input', e => { S.speed = e.target.value / 100; $('#speedOut').textContent = e.target.value + '%'; });
$('#mListen').addEventListener('click', () => setMode('listen'));
$('#mWait').addEventListener('click', () => {
  setMode('wait');
  if (!pressed.size && !midiAccess) toast('Connect your piano, or click the on-screen keys, to move through the song.');
});
$('#practice').addEventListener('change', e => { S.practice = e.target.value; silenceAll(); rebuildGroups(); });
$('#view').addEventListener('change', e => setView(e.target.value));
$('#output').addEventListener('change', e => {
  S.output = e.target.value; silenceAll();
  if (S.output === 'piano' && !midiOut) toast('No piano output found yet. Press "Connect my piano" first.');
});
$('#names').addEventListener('change', e => { S.names = e.target.value; });
$('#handsBy').addEventListener('change', e => { S.handsBy = e.target.value; assignHands(); rebuildGroups(); });
$('#echo').addEventListener('change', e => { S.echo = e.target.checked; });
$('#loopA').addEventListener('click', () => {
  S.loopA = Math.max(0, S.pos);
  if (S.loopB !== null && S.loopB <= S.loopA) S.loopB = null;
  updateLoop();
});
$('#loopB').addEventListener('click', () => {
  if (S.loopA === null) S.loopA = 0;
  if (S.pos <= S.loopA + 0.2) { toast('Move further into the song, then set the loop end.'); updateLoop(); return; }
  S.loopB = S.pos; updateLoop();
});
$('#loopClear').addEventListener('click', () => { S.loopA = S.loopB = null; updateLoop(); });

/* files */
function loadFile(file) {
  if (!file) return;
  if (!/\.(mid|midi)$/i.test(file.name)) { toast('Please choose a MIDI file (.mid or .midi).'); return; }
  file.arrayBuffer().then(buf => {
    try {
      const r = parseMidi(buf);
      const tracks = new Set(r.notes.map(n => n.key)).size;
      setSong(r, file.name.replace(/\.[^.]+$/, ''), tracks >= 2 ? 'track' : 'split');
      if (r.skipped) toast(r.skipped + ' notes outside the piano range were left out.');
    } catch (err) { toast(err.message || 'Could not read that file.'); }
  });
}
$('#openBtn').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', e => { loadFile(e.target.files[0]); e.target.value = ''; });
$('#demoBtn').addEventListener('click', () => setSong(demoSong(), 'Ode to Joy', 'track'));
$('#midiPill').addEventListener('click', () => { if (midiAccess) refreshPorts(); else initMIDI(); });

let dragDepth = 0;
const dropEl = $('#drop');
window.addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; dropEl.classList.add('on'); });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) dropEl.classList.remove('on'); });
window.addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; dropEl.classList.remove('on'); loadFile(e.dataTransfer.files[0]); });

window.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'select' || tag === 'button' || tag === 'textarea') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'r' || e.key === 'R') seek(-LEAD);
  else if (e.key === 'ArrowLeft') seek(S.pos - 5);
  else if (e.key === 'ArrowRight') seek(S.pos + 5);
});

/* ---------- main loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (S.playing) advance(dt);
  draw(); drawScore(); updateUI();
  requestAnimationFrame(frame);
}

new ResizeObserver(layout).observe($('#wrap'));
window.addEventListener('resize', layout);
if (document.fonts && document.fonts.load) document.fonts.load('40px NotoMusicSub', '\uD834\uDD1E\u266F');
layout();
setSong(demoSong(), 'Ode to Joy', 'track');
initMIDI();
requestAnimationFrame(frame);
})();
</script>
<script>
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
